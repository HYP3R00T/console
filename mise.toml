[tools]
biome = "latest"
node = "lts"
nono = "0.80.0"
"npm:@changesets/cli" = "latest"
pnpm = "latest"
prek = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
tombi = "latest"

[settings]
experimental = true
lockfile = true

[settings.github]
use_git_credentials = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh" }

[env]
_.file = ".env"  # for sensitive data

[tasks.dev]
description = "Run the server and web app together"
depends = ["dev:server", "dev:web"]

[tasks."dev:server"]
description = "Run the Fastify development server"
run = "pnpm dev:server"

[tasks."dev:web"]
description = "Run the Next.js development app"
run = "pnpm dev:web"
