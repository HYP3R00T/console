name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run prek checks
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --skip no-commit-to-branch

  application-checks:
    name: Application checks
    runs-on: ubuntu-latest
    env:
      CONSOLE_REQUIRE_SANDBOX_TEST: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up application tools
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install and verify workspace sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor
          # Permit only Bubblewrap to create namespaces on the disposable runner.
          sudo tee /etc/apparmor.d/console-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile console-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/console-ci-bwrap
          bwrap --version
          bwrap --unshare-all --unshare-user --disable-userns --cap-drop ALL --new-session --die-with-parent --ro-bind / / --proc /proc --dev /dev -- true
      - name: Check types
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Build packages
        run: pnpm build
